name: Sonar Qube Scan

on:
  workflow_call:

jobs:
  sonar-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required by SonarQube to parse Git history and authors correctly

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        with:
          # Explicit project configuration arguments
          args: >
            -Dsonar.projectKey=devboard
            -Dsonar.projectName=devboard
            -Dsonar.sources=backend,frontend
            -Dsonar.projectBaseDir=.
            -X
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # FIX: This tries your secret first, checks your variables second, 
          # and falls back to public SonarCloud if both are missing to completely stop the crash.
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
