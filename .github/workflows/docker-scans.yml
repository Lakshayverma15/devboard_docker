name: Docker Scan

on: 
    workflow_call:

jobs:
    docker-file-lint-and-scan:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix: 
                folders: ['backend', 'frontend']
        steps:
            - name: Code Checkout
              uses: actions/checkout@v4

            - name: ${{ matrix.folders }} Dockerfile Lint
              uses: hadolint/hadolint-action@v3.1.0
              with:
                dockerfile: ${{ matrix.folders }}/Dockerfile
              
            - name: Docker Setup [Login]
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Docker Build ${{ matrix.folders }}
              uses: docker/build-push-action@v6
              with:
                context: ./${{ matrix.folders }}
                file: ./${{ matrix.folders }}/Dockerfile
                # Hardcoded username target to completely eliminate variable context slashes
                tags: lakshayverma1515/devboard-${{ matrix.folders }}:latest
                push: false
                load: true

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@v0.35.0
              continue-on-error: true
              with:
                image-ref: lakshayverma1515/devboard-${{ matrix.folders }}:latest
                format: 'table'
                exit-code: '1'
                ignore-unfixed: true
                scanners: 'vuln'
                severity: 'CRITICAL'
