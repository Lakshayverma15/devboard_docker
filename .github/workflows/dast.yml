# Goal - To ensure my running application is free from OWASP top 10 security issues
name: OWASP ZAP DAST Scan

on:
  workflow_call:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Copy Example Env to main env
        run: cp .env.example .env

      - name: Docker Setup [Login]
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Spin up containers inside this runner so ZAP has a target to scan
      - name: Start services for scanning
        run: |
          docker compose pull
          docker compose up -d

      # Fixed: Changed from the broken EC2 template to localhost
      - name: Wait for services to be healthy
        run: |
          echo "Checking connectivity to http://localhost:8080..."
          timeout 60s sh -c 'until curl -sf "http://localhost:8080" > /dev/null; do echo "Waiting for app to start..."; sleep 2; done'

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:8080'
          fail_action: false
          allow_issue_writing: false
